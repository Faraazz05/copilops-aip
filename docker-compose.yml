# CopilOPS Aeronautical Data Platform - Compose
# Author: Mohd Faraz (https://faraazz05.github.io)
version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copilops-aip-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/copilops_aip
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: copilops-aip-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
